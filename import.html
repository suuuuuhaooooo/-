            --dark: #5b6348;

            --white: #ffffff; 
            --border: #eeeeee; 
        }

            margin: 0; padding: 0;
            background-color: var(--bg);
            font-family: "Noto Serif TC", serif;
            color: #333;

        }

        .navbar {
            background: white; padding: 15px 20px; box-shadow: 0 1px 5px rgba(0,0,0,0.05);
            display: flex; justify-content: space-between; align-items: center;
            position: fixed; top: 0; left: 0; width: 100%; box-sizing: border-box; z-index: 100;
            height: 60px;
        }
        .brand-title { font-weight: 700; font-size: 16px; color: var(--dark); letter-spacing: 1px; }

        .container {
            padding: 85px 20px 40px 20px;
            max-width: 1000px;
            margin: 0 auto;
            box-sizing: border-box;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.04);
            border-top: 5px solid var(--primary);
            margin-bottom: 20px;
        }

        h2 { margin-top: 0; color: var(--dark); font-size: 18px; }
        p { font-size: 13px; color: #666; line-height: 1.5; }

        /* 拖曳上傳區 */
        .drop-zone {
            border: 2px dashed var(--primary);
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            background: #fafafa;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 20px;
        }
        .drop-zone:hover { background: #f0f3ef; }
        .drop-zone p { margin: 10px 0 0 0; font-weight: bold; color: var(--dark); }

        /* 設定列 */
        .row { display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }
        .col { flex: 1; min-width: 150px; }
        label { display: block; font-size: 13px; font-weight: bold; color: #444; margin-bottom: 5px; }
        select, input[type="text"] {
            width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;
            font-family: "Noto Serif TC", serif; font-size: 14px; box-sizing: border-box;
            background-color: #fafafa;
        }

        .btn {
            background: var(--primary); color: white; border: none; padding: 12px 20px;
            cursor: pointer; font-weight: bold; border-radius: 6px; font-size: 15px;
            font-family: "Noto Serif TC", serif; width: 100%; transition: 0.3s;
        }
        .btn:hover:not(:disabled) { background: var(--dark); }
        .btn:disabled { background: #ccc; cursor: not-allowed; }

        /* 預覽表格區 */
        .table-responsive { width: 100%; overflow-x: auto; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; background: white; min-width: 800px; }
        th, td { border: 1px solid var(--border); padding: 10px; text-align: left; vertical-align: top; }
        th { background: #f0f3ef; color: var(--dark); font-weight: bold; }
        td input, td textarea { 
            width: 100%; border: 1px solid #ddd; padding: 6px; 
            font-family: inherit; font-size: 13px; box-sizing: border-box; 
            border-radius: 4px; background: #fafafa;
        }
        td input:focus, td textarea:focus { border-color: var(--primary); outline: none; background: #fff; }
        td textarea { resize: vertical; min-height: 60px; }

        .actions { margin-top: 20px; display: flex; gap: 10px; }
        .btn-danger { background: #c0392b; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .btn-danger:hover { background: #962d22; }

        /* Loading */
        #loading-overlay { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(255,255,255,0.9); z-index: 9999; 
            flex-direction: column; justify-content: center; align-items: center;

        .spinner { 
            border: 4px solid #eef1e6; border-top: 4px solid var(--primary);

        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

</head>

            dropZone.style.background = '#fafafa';

        // 1. 統一宣告全域變數，不再打架
        let uploadedFileMimeType = "image/jpeg"; 

        async function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);

            if (isPdf) {
                document.getElementById('drop-zone-text').innerHTML = `<span style="color:var(--dark);">正在將 PDF 全文合併為高畫質影像，請稍候...</span>`;
                document.getElementById('parse-btn').disabled = true;
                
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                
                // 準備陣列裝載每一頁
                const canvases = [];
                let totalHeight = 0;
                let maxWidth = 0;

                // 迴圈讀取 PDF 的「每一頁」
                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    const viewport = page.getViewport({ scale: 2.0 }); // 2倍高畫質
                    
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;
                    
                    await page.render({ canvasContext: context, viewport: viewport }).promise;
                    
                    canvases.push(canvas);
                    totalHeight += viewport.height;
                    if (viewport.width > maxWidth) maxWidth = viewport.width;
                }

                // 建立一個終極大畫布，把所有頁面垂直拼起來
                const combinedCanvas = document.createElement('canvas');
                combinedCanvas.width = maxWidth;
                combinedCanvas.height = totalHeight;
                const combinedCtx = combinedCanvas.getContext('2d');
                
                let currentY = 0;
                for (let canvas of canvases) {
                    combinedCtx.drawImage(canvas, 0, currentY);
                    currentY += canvas.height;
                }

                // 轉為優質 JPEG Base64 (0.8畫質兼顧清晰與體積)
                const jpegDataUrl = combinedCanvas.toDataURL('image/jpeg', 0.8);
                uploadedImageBase64 = jpegDataUrl.split(',')[1];
                uploadedFileMimeType = 'image/jpeg';

                dropZone.style.borderColor = '#5b6348';
                document.getElementById('drop-zone-text').innerHTML = `<span style="color:var(--dark); font-weight:bold;">已載入完整考卷（共 ${pdf.numPages} 頁）：${file.name}</span>`;
                document.getElementById('parse-btn').disabled = false;
            } else {
                // 一般圖片的處理
                uploadedFileMimeType = file.type || 'image/jpeg';
                const reader = new FileReader();
                reader.onload = function(e) {
                    uploadedImageBase64 = e.target.result.split(',')[1];
                    dropZone.style.borderColor = '#5b6348';
                    document.getElementById('drop-zone-text').innerHTML = `<span style="color:var(--dark); font-weight:bold;">已載入圖片：${file.name}</span>`;
                    document.getElementById('parse-btn').disabled = false;
                };
                reader.readAsDataURL(file);
            }
        }
        
        // ==========================================
        // 呼叫 AI 解析 (支援多層級課綱字典)
        // ==========================================
        async function startAIAnalysis() {
            // 3. 對齊變數名稱檢查 uploadedImageBase64
            if (!uploadedImageBase64) return;

            // 密碼攔截機制
            if (!SECURE_TOKEN) {
                SECURE_TOKEN = prompt("請輸入密碼：");
                if (!SECURE_TOKEN) {
                    alert("已取消操作。");
                    return;
                }
            }

            // 準備動態課綱給 AI 參考 (完美讀取您的巢狀結構)
            const pub = document.getElementById('common-publisher').value;
            const grade = document.getElementById('common-grade').value;
            const semester = document.getElementById('common-semester').value;
            let syllabusContext = "無指定範圍，請依 108 課綱自由分類";
            
            if (syllabusDictionary[pub] && syllabusDictionary[pub][grade + semester]) {
                let selectedSyllabus = syllabusDictionary[pub][grade + semester];
                let syllabusArray = [];
                
                // 將您整理的大章節與小節組合起來，讓 AI 看得懂
                for (let chapter in selectedSyllabus) {
                    let subChapters = selectedSyllabus[chapter].join("、");
                    syllabusArray.push(`${chapter}包含小節：${subChapters}`);
                }
                syllabusContext = "請限定在以下單元中挑選最適合的一項填入：\n" + syllabusArray.join("\n");
            }

            document.getElementById('loading-overlay').style.display = 'flex';
            document.getElementById('load-msg').innerText = `AI 正在深度解析 ${pub}版 ${grade}${semester} 考卷...`;

            try {
                const response = await fetch(GAS_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        token: SECURE_TOKEN,
                        action: 'parseImage',
                        image: uploadedImageBase64,       // 4. 傳送正確的 Base64 變數
                        mimeType: uploadedFileMimeType,   // 傳送檔案格式
                        syllabus: syllabusContext
                    })
                });

                const result = await response.json();
                
                if (result.success && Array.isArray(result.data)) {
                    parsedQuestions = result.data;
                    renderTable();
                    document.getElementById('preview-card').style.display = 'block';
                    window.scrollTo({ top: document.getElementById('preview-card').offsetTop, behavior: 'smooth' });
                } else {
                    alert("解析失敗：" + (result.error || "回傳格式錯誤"));
                }
            } catch (err) {
                alert("連線發生錯誤：" + err.message);
            } finally {
                document.getElementById('loading-overlay').style.display = 'none';
            }
        }

        function copyQuestionText(index) {
            let q = parsedQuestions[index];
            
            // 這裡可以自由排版您複製出來想要長什麼樣子
            let textToCopy = `【題目】\n`;
            if (q.共用題幹) textToCopy += `${q.共用題幹}\n`;
            textToCopy += `${q.題目}\n\n`;
            
            textToCopy += `【選項】\n(1) ${q.選項1}\n(2) ${q.選項2}\n(3) ${q.選項3}\n(4) ${q.選項4}\n\n`;
            textToCopy += `【解答】\n${q.簡答}\n\n`;
            textToCopy += `【詳解】\n${q.詳解}`;
            
            // 呼叫瀏覽器內建剪貼簿 API
            navigator.clipboard.writeText(textToCopy).then(() => {
                alert("此題內容已成功複製到剪貼簿！");
            }).catch(err => {
                alert("複製失敗：" + err);

            const commonData = {
                科目: document.getElementById('common-subject').value,
                學年度: document.getElementById('common-year').value,
                學期: document.getElementById('common-semester').value,
                年段: document.getElementById('common-grade').value,
                版本: document.getElementById('common-publisher').value,
                段考: document.getElementById('common-exam').value,
                出處: document.getElementById('common-source').value
            };

            if (!confirm(`準備將 ${parsedQuestions.length} 題寫入【${commonData.科目}】資料庫，確認執行？`)) return;

            document.getElementById('loading-overlay').style.display = 'flex';
            document.getElementById('load-msg').innerText = "資料庫批次寫入中，請勿關閉視窗...";

            try {
                const response = await fetch(GAS_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        token: SECURE_TOKEN,
                        action: 'batchInsertQuestions',
                        commonData: commonData,
                        questionsData: parsedQuestions
                    })
                });

                const result = await response.json();
                
                if (result.success) {
                    alert(`恭喜！成功將 ${result.count} 題寫入資料庫！`);
                    // 寫入成功後清空暫存與表格
                    parsedQuestions = [];
                    renderTable();
                    document.getElementById('preview-card').style.display = 'none';
                    document.getElementById('drop-zone').style.borderColor = 'var(--primary)';
                    document.getElementById('drop-zone-text').innerHTML = '點擊或將下一份考卷圖片拖曳至此上傳';
                    document.getElementById('parse-btn').disabled = true;
                    uploadedImageBase64 = null;
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else {
                    alert("寫入失敗：" + result.error);
                }
            } catch (err) {
                alert("連線發生錯誤：" + err.message);
            } finally {
                document.getElementById('loading-overlay').style.display = 'none';
            }
        }
        // ==========================================
        // 鎖定右鍵與版權警告
        // ==========================================
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault(); 
            alert("嚴禁翻印，尊重版權");
        });

        // ==========================================
        // 禁止滑鼠選取、防止 Ctrl+C 複製
        // ==========================================
        
        // 1. 禁止滑鼠拖曳選取文字
        document.addEventListener('selectstart', function(e) {
            // 如果是在輸入框或文字輸入區裡面，允許選取
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
                return true;
            }
            e.preventDefault();
        });

        // 2. 禁止使用快捷鍵複製 (Ctrl+C / Ctrl+X)
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && (e.key === 'c' || e.key === 'C' || e.key === 'x' || e.key === 'X')) {
                // 如果焦點剛好在輸入框內，允許複製
                if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') {
                    return true;
                }
                e.preventDefault();
                alert("嚴禁翻印，尊重版權！");
            }
        });
    </script>
</body>
</html>
