<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>蘇昊數理｜雲端題庫系統</title>
    
    <meta name="description" content="學員的雲端自動組卷系統，即時篩選、雲端編譯、秒出考卷。">
    <link rel="icon" href="https://suuuuuhaooooo.github.io/-/favicon.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- 引入 LINE LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    
    <style>
        /* ==========================================
           基礎品牌與字體設定
           ========================================== */
        @font-face {
            font-family: 'SuHaoMing';
            src: url('cwTeXQMingZH-Medium.woff2') format('woff2'),
                 url('cwTeXQMingZH-Medium.ttf') format('truetype');
            font-display: swap; 
        }
        
        :root { 
            --primary: #8e9775; 
            --dark: #5b6348; 
            --bg: #f5f5f5; 
            --white: #ffffff; 
            --border: #eeeeee; 
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg);
            font-family: "Noto Serif TC", serif;
            color: #333;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            -webkit-user-select: none;
        }

        /* ==========================================
           頂部導覽列
           ========================================== */
        .navbar {
            background: white; padding: 15px 20px; box-shadow: 0 1px 5px rgba(0,0,0,0.05);
            display: flex; justify-content: space-between; align-items: center;
            position: fixed; top: 0; left: 0; width: 100%; box-sizing: border-box; z-index: 100;
            height: 60px;
        }
        .brand-title { font-weight: 700; font-size: 16px; color: var(--dark); letter-spacing: 1px; }
        .user-badge { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: bold; color: #666; }
        .user-badge img { width: 28px; height: 28px; border-radius: 50%; border: 1px solid #ddd; }

        /* ==========================================
           主容器與卡片設計
           ========================================== */
        .container {
            padding: 85px 20px 40px 20px;
            max-width: 500px;
            margin: 0 auto;
            box-sizing: border-box;
        }

        .filter-card {
            background: white;
            border-radius: 12px;
            padding: 25px 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.04);
            border-top: 5px solid var(--primary);
            margin-bottom: 20px;
        }

        .filter-card h2 {
            margin: 0 0 5px 0;
            font-size: 18px;
            color: var(--dark);
            letter-spacing: 1.5px;
        }
        .filter-card p {
            margin: 0 0 20px 0;
            font-size: 13px;
            color: #888;
            line-height: 1.5;
        }

        /* 表單元素 */
        .input-group { margin-bottom: 15px; }
        .input-group label {
            display: block; font-size: 13px; color: #444; margin-bottom: 6px; font-weight: bold; letter-spacing: 1px;
        }
        
        select, input[type="number"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            background: #fafafa;
            border-radius: 8px;
            font-family: "Noto Serif TC", serif;
            font-size: 14px;
            color: #333;
            outline: none;
            box-sizing: border-box;
            transition: 0.3s;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23888' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 15px center;
            background-size: 15px;
        }
        select:focus, input[type="number"]:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(142,151,117,0.1);
        }
        select:disabled { background-color: #eee; color: #999; cursor: not-allowed; }

        .main-btn { 
            background: var(--primary); color: white; border: none; padding: 15px; 
            width: 100%; cursor: pointer; letter-spacing: 2px; font-weight: 700; 
            transition: 0.3s; border-radius: 8px; font-size: 16px; font-family: "Noto Serif TC", serif;
            margin-top: 15px;
            display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .main-btn:disabled { background: #ccc; cursor: not-allowed; }
        .main-btn:hover:not(:disabled) { background: var(--dark); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(142,151,117,0.3); }

        /* ==========================================
           全螢幕 Loading 遮罩
           ========================================== */
        #loading-overlay { 
            display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(255,255,255,0.9); z-index: 9999; 
            backdrop-filter: blur(5px);
            flex-direction: column; justify-content: center; align-items: center; 
        }
        .spinner { 
            border: 4px solid #eef1e6; border-top: 4px solid var(--primary); 
            border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; margin-bottom: 15px; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-text { color: var(--dark); font-weight: bold; letter-spacing: 1.5px; font-size: 15px; }
        .loading-subtext { color: #888; font-size: 12px; margin-top: 8px; letter-spacing: 1px; }

        /* 資料統整小卡 */
        .info-box {
            background: #eef1e6;
            border-left: 4px solid var(--primary);
            padding: 12px 15px;
            border-radius: 0 8px 8px 0;
            font-size: 12px;
            color: #555;
            margin-bottom: 20px;
            line-height: 1.6;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="loading-overlay">
        <div class="spinner"></div>
        <div class="loading-text" id="loading-text">系統初始化中...</div>
        <div class="loading-subtext" id="loading-subtext">正在驗證您的 LINE 帳號</div>
    </div>

    <nav class="navbar">
        <div class="brand-title">蘇昊題庫中心</div>
        <div class="user-badge" id="user-badge">
            <span id="user-name">載入中</span>
            <img id="user-avatar" src="https://suuuuuhaooooo.github.io/-/favicon.png" alt="Avatar">
        </div>
    </nav>

    <div class="container">
        
        <div class="filter-card">
            <h2>自訂考卷條件</h2>
            <p>請選擇您想篩選的條件，系統將透過雲端編譯器為您即時產出 PDF 考卷。</p>
            
            <div class="info-box" id="db-info">
                資料庫連線中，請稍候...
            </div>

            <!-- 對齊 image_48be15.jpg 欄位 -->
            <div class="input-group">
                <label>選擇年段</label>
                <select id="select-grade" onchange="onGradeChange()" disabled>
                    <option value="">請先等待資料同步...</option>
                </select>
            </div>

            <div class="input-group">
                <label>選擇版本</label>
                <select id="select-version" onchange="onVersionChange()" disabled>
                    <option value="">請先選擇年段</option>
                </select>
            </div>

            <div class="input-group">
                <label>選擇章節</label>
                <select id="select-chapter" onchange="onChapterChange()" disabled>
                    <option value="">請先選擇版本</option>
                </select>
            </div>

            <div class="input-group">
                <label>選擇次章節</label>
                <select id="select-subchapter" onchange="onSubchapterChange()" disabled>
                    <option value="">請先選擇章節</option>
                </select>
            </div>

            <div class="input-group">
                <label>抽卷題數 (上限 20 題)</label>
                <input type="number" id="input-count" value="10" min="1" max="20" disabled>
            </div>

            <button class="main-btn" id="generate-btn" onclick="triggerRenderCompilation()" disabled>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                開始雲端組卷
            </button>
        </div>

    </div>

    <div style="text-align: center; font-size: 10px; color: #bbb; margin-top: 10px; letter-spacing: 1px; font-family: Arial, sans-serif;">
        &copy; 2026 蘇昊數理 Su-Hao Math/Science.
    </div>

    <script>
        // ==========================================
        // 核心設定與變數
        // ==========================================
        const MY_LIFF_ID = "2010896789-64Pzz9hx";
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwg1reUCaWdmvnjQyxxfOUSNL-6niiiaQlLztgOvSavphpUF2MzAXMVC1fa0TtLsLoC/exec?token=suhao2026";
        const RENDER_SERVER_URL = "https://suhao-exam-api.onrender.com/generate"; 

        let globalQuestions = [];
        let currentUser = { name: "同學", uid: "" };

        // ==========================================
        // 1. 初始化 LIFF
        // ==========================================
        window.onload = async function() {
            try {
                await liff.init({ liffId: MY_LIFF_ID });
                
                if (!liff.isInClient()) {
                    showError("為保護權益，題庫系統僅限在 LINE 聊天室內部開啟。");
                    return;
                }
                
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }

                const profile = await liff.getProfile();
                currentUser.name = profile.displayName;
                currentUser.uid = profile.userId;
                
                document.getElementById('user-name').innerText = currentUser.name;
                if(profile.pictureUrl) {
                    document.getElementById('user-avatar').src = profile.pictureUrl;
                }

                fetchQuestionBank();

            } catch (err) {
                showError("LINE 驗證失敗，請重新開啟此頁面。");
            }
        };

        // ==========================================
        // 2. 抓取雲端題庫資料
        // ==========================================
        async function fetchQuestionBank() {
            setLoadingState("正在同步雲端題庫資料...", "向 Google 資料庫請求中 (約需 2~3 秒)");
            try {
                const response = await fetch(GAS_API_URL);
                const data = await response.json();
                
                if (!data || data.length === 0) {
                    throw new Error("題庫目前沒有資料");
                }
                
                globalQuestions = data;
                initDropdowns();

            } catch (error) {
                showError("題庫同步失敗，請聯絡管理員。");
                console.error(error);
            }
        }

        // ==========================================
        // 3. 動態連動選單邏輯
        // ==========================================
        function initDropdowns() {
            // 提取所有不重複的「年段」
            const grades = [...new Set(globalQuestions.map(q => q['年段']).filter(Boolean))];
            
            const gradeSelect = document.getElementById('select-grade');
            gradeSelect.innerHTML = '<option value="" disabled selected>請選擇年段...</option>';
            grades.forEach(g => {
                let opt = document.createElement('option');
                opt.value = g; opt.innerText = g;
                gradeSelect.appendChild(opt);
            });

            gradeSelect.disabled = false;
            document.getElementById('db-info').innerHTML = `<b>資料庫同步完成</b><br>目前題庫總計收錄：<b>${globalQuestions.length}</b> 題。`;
            hideLoading();
        }

        function onGradeChange() {
            const selectedGrade = document.getElementById('select-grade').value;
            const filtered = globalQuestions.filter(q => q['年段'] === selectedGrade);
            
            const versions = [...new Set(filtered.map(q => q['版本']).filter(Boolean))];
            const versionSelect = document.getElementById('select-version');
            
            versionSelect.innerHTML = '<option value="" disabled selected>請選擇版本...</option>';
            versions.forEach(v => {
                let opt = document.createElement('option');
                opt.value = v; opt.innerText = v;
                versionSelect.appendChild(opt);
            });
            
            versionSelect.disabled = false;
            
            // 重置下方選單
            document.getElementById('select-chapter').innerHTML = '<option value="" disabled selected>請先選擇版本</option>';
            document.getElementById('select-chapter').disabled = true;
            document.getElementById('select-subchapter').innerHTML = '<option value="" disabled selected>請先選擇章節</option>';
            document.getElementById('select-subchapter').disabled = true;
            document.getElementById('input-count').disabled = true;
            document.getElementById('generate-btn').disabled = true;
        }

        function onVersionChange() {
            const selectedGrade = document.getElementById('select-grade').value;
            const selectedVersion = document.getElementById('select-version').value;
            const filtered = globalQuestions.filter(q => q['年段'] === selectedGrade && q['版本'] === selectedVersion);
            
            const chapters = [...new Set(filtered.map(q => q['章節']).filter(Boolean))];
            const chapterSelect = document.getElementById('select-chapter');
            
            chapterSelect.innerHTML = '<option value="" disabled selected>請選擇章節...</option>';
            chapters.forEach(c => {
                let opt = document.createElement('option');
                opt.value = c; opt.innerText = c;
                chapterSelect.appendChild(opt);
            });
            
            chapterSelect.disabled = false;
            
            // 重置下方選單
            document.getElementById('select-subchapter').innerHTML = '<option value="" disabled selected>請先選擇章節</option>';
            document.getElementById('select-subchapter').disabled = true;
            document.getElementById('input-count').disabled = true;
            document.getElementById('generate-btn').disabled = true;
        }

        function onChapterChange() {
            const selectedGrade = document.getElementById('select-grade').value;
            const selectedVersion = document.getElementById('select-version').value;
            const selectedChapter = document.getElementById('select-chapter').value;
            
            const filtered = globalQuestions.filter(q => 
                q['年段'] === selectedGrade && 
                q['版本'] === selectedVersion && 
                q['章節'] === selectedChapter
            );
            
            const subchapters = [...new Set(filtered.map(q => q['次章節']).filter(Boolean))];
            const subSelect = document.getElementById('select-subchapter');
            
            subSelect.innerHTML = '<option value="全部">全部次章節 (混合抽題)</option>';
            subchapters.forEach(sc => {
                let opt = document.createElement('option');
                opt.value = sc; opt.innerText = sc;
                subSelect.appendChild(opt);
            });
            
            subSelect.disabled = false;
            document.getElementById('input-count').disabled = false;
            document.getElementById('generate-btn').disabled = false;
        }

        function onSubchapterChange() {
            // 只要改變次章節，按鈕依然保持可用狀態
            document.getElementById('generate-btn').disabled = false;
        }

        // ==========================================
        // 4. 傳送指令給 Render 伺服器
        // ==========================================
        async function triggerRenderCompilation() {
            const selectedGrade = document.getElementById('select-grade').value;
            const selectedVersion = document.getElementById('select-version').value;
            const selectedChapter = document.getElementById('select-chapter').value;
            const selectedSubchapter = document.getElementById('select-subchapter').value;
            let count = parseInt(document.getElementById('input-count').value);
            
            if (count > 20) count = 20;
            if (count < 1) count = 1;

            setLoadingState("正在驅動雲端編譯器...", "XeLaTeX 引擎排版中，請勿關閉視窗 (約需 10~15 秒)");

            // 更新了傳送給後端 Python 的鍵值，請確保您的 app.py 對齊這些參數
            const payload = {
                uid: currentUser.uid,
                name: currentUser.name,
                grade: selectedGrade,
                version: selectedVersion,
                chapter: selectedChapter,
                subchapter: selectedSubchapter,
                questionCount: count
            };

            try {
                // 真正的串接代碼！
                const res = await fetch(RENDER_SERVER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    const blob = await res.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `蘇昊題庫_${payload.chapter}.pdf`;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    window.URL.revokeObjectURL(url);
                    
                    alert("組卷產出成功！系統已為您下載。");
                    liff.closeWindow(); 
                } else {
                    const errData = await res.json();
                    showError("產出失敗：" + (errData.error || "伺服器無回應"));
                }
            } catch (err) {
                showError("雲端編譯伺服器無回應，請確認 Render 服務是否已啟動。");
            }
        }

        // ==========================================
        // UI 防護功能
        // ==========================================
        function setLoadingState(mainText, subText) {
            document.getElementById('loading-overlay').style.display = 'flex';
            document.getElementById('loading-text').innerText = mainText;
            document.getElementById('loading-subtext').innerText = subText;
        }

        function hideLoading() {
            document.getElementById('loading-overlay').style.display = 'none';
        }

        function showError(msg) {
            document.getElementById('loading-overlay').style.display = 'flex';
            document.getElementById('loading-overlay').innerHTML = `
                <div style="font-size: 40px; margin-bottom: 10px;"></div>
                <div style="color: #c0392b; font-weight: bold; font-size: 16px; text-align: center; padding: 0 20px;">
                    ${msg}
                </div>
            `;
        }

        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('copy', (e) => e.preventDefault());
    </script>
</body>
</html>
