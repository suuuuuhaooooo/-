<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>蘇昊數理｜雲端題庫系統</title>
    
    <meta name="description" content="學員的雲端自動組卷系統，即時篩選、雲端編譯、秒出考卷。">
    <link rel="icon" href="https://suuuuuhaooooo.github.io/-/favicon.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- 引入 LINE LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    
    <style>
        /* ==========================================
           基礎品牌與字體設定
           ========================================== */
        @font-face {
            font-family: 'SuHaoMing';
            src: url('cwTeXQMingZH-Medium.woff2') format('woff2'),
                 url('cwTeXQMingZH-Medium.ttf') format('truetype');
            font-display: swap; 
        }
        
        :root { 
            --primary: #8e9775; 
            --dark: #5b6348; 
            --bg: #f5f5f5; 
            --white: #ffffff; 
            --border: #eeeeee; 
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg);
            font-family: "Noto Serif TC", serif;
            color: #333;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            -webkit-user-select: none;
        }

        /* ==========================================
           頂部導覽列
           ========================================== */
        .navbar {
            background: white; padding: 15px 20px; box-shadow: 0 1px 5px rgba(0,0,0,0.05);
            display: flex; justify-content: space-between; align-items: center;
            position: fixed; top: 0; left: 0; width: 100%; box-sizing: border-box; z-index: 100;
            height: 60px;
        }
        .brand-title { font-weight: 700; font-size: 16px; color: var(--dark); letter-spacing: 1px; }
        .user-badge { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: bold; color: #666; }
        .user-badge img { width: 28px; height: 28px; border-radius: 50%; border: 1px solid #ddd; }

        /* ==========================================
           主容器與卡片設計
           ========================================== */
        .container {
            padding: 85px 20px 40px 20px;
            max-width: 500px;
            margin: 0 auto;
            box-sizing: border-box;
        }

        .filter-card {
            background: white;
            border-radius: 12px;
            padding: 25px 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.04);
            border-top: 5px solid var(--primary);
            margin-bottom: 20px;
        }

        .filter-card h2 {
            margin: 0 0 5px 0;
            font-size: 18px;
            color: var(--dark);
            letter-spacing: 1.5px;
        }
        .filter-card p {
            margin: 0 0 20px 0;
            font-size: 13px;
            color: #888;
            line-height: 1.5;
        }

        /* 表單元素 */
        .input-group { margin-bottom: 15px; }
        .input-group label {
            display: block; font-size: 13px; color: #444; margin-bottom: 6px; font-weight: bold; letter-spacing: 1px;
        }
        
        select, input[type="number"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            background: #fafafa;
            border-radius: 8px;
            font-family: "Noto Serif TC", serif;
            font-size: 14px;
            color: #333;
            outline: none;
            box-sizing: border-box;
            transition: 0.3s;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23888' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 15px center;
            background-size: 15px;
        }
        select:focus, input[type="number"]:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(142,151,117,0.1);
        }
        select:disabled, input[type="number"]:disabled { background-color: #eee; color: #999; cursor: not-allowed; }

        .main-btn { 
            background: var(--primary); color: white; border: none; padding: 15px; 
            width: 100%; cursor: pointer; letter-spacing: 2px; font-weight: 700; 
            transition: 0.3s; border-radius: 8px; font-size: 16px; font-family: "Noto Serif TC", serif;
            margin-top: 15px;
            display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .main-btn:disabled { background: #ccc; cursor: not-allowed; }
        .main-btn:hover:not(:disabled) { background: var(--dark); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(142,151,117,0.3); }

        /* ==========================================
           全螢幕 Loading 遮罩
           ========================================== */
        #loading-overlay { 
            display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(255,255,255,0.9); z-index: 9999; 
            backdrop-filter: blur(5px);
            flex-direction: column; justify-content: center; align-items: center; 
        }
        .spinner { 
            border: 4px solid #eef1e6; border-top: 4px solid var(--primary); 
            border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; margin-bottom: 15px; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-text { color: var(--dark); font-weight: bold; letter-spacing: 1.5px; font-size: 15px; }
        .loading-subtext { color: #888; font-size: 12px; margin-top: 8px; letter-spacing: 1px; }

        /* 資料統整小卡 */
        .info-box {
            background: #eef1e6;
            border-left: 4px solid var(--primary);
            padding: 12px 15px;
            border-radius: 0 8px 8px 0;
            font-size: 12px;
            color: #555;
            margin-bottom: 20px;
            line-height: 1.6;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="loading-overlay">
        <div class="spinner"></div>
        <div class="loading-text" id="loading-text">系統初始化中...</div>
        <div class="loading-subtext" id="loading-subtext">正在驗證您的 LINE 帳號</div>
    </div>

    <nav class="navbar">
        <div class="brand-title">蘇昊題庫中心</div>
        <div class="user-badge" id="user-badge">
            <span id="user-name">載入中</span>
            <img id="user-avatar" src="https://suuuuuhaooooo.github.io/-/favicon.png" alt="Avatar">
        </div>
    </nav>

    <div class="container">
        
        <div class="filter-card">
            <h2>自訂考卷條件</h2>
            <p>請自由組合篩選條件，無須依照順序，系統將自動過濾符合的題目。</p>
            
            <div class="info-box" id="db-info">
                請先選擇科目以載入題庫。
            </div>

            <!-- 新增：科目選擇 (用來決定呼叫哪一個 Sheet) -->
            <div class="input-group">
                <label>選擇科目</label>
                <select id="select-subject" onchange="fetchQuestionBank()">
                    <option value="" disabled selected>請選擇科目...</option>
                    <option value="數學">數學</option>
                    <option value="理化">理化</option>
                </select>
            </div>

            <!-- 無階層動態條件選項 -->
            <div class="input-group">
                <label>選擇年段</label>
                <select id="select-grade" disabled><option value="">全部</option></select>
            </div>

            <div class="input-group">
                <label>選擇段考</label>
                <select id="select-exam" disabled><option value="">全部</option></select>
            </div>

            <div class="input-group">
                <label>選擇版本</label>
                <select id="select-version" disabled><option value="">全部</option></select>
            </div>

            <div class="input-group">
                <label>選擇章節</label>
                <select id="select-chapter" disabled><option value="">全部</option></select>
            </div>

            <div class="input-group">
                <label>選擇題型</label>
                <select id="select-type" disabled><option value="">全部</option></select>
            </div>

            <div class="input-group">
                <label>選擇難易度</label>
                <select id="select-difficulty" disabled><option value="">全部</option></select>
            </div>

            <div class="input-group">
                <label>抽卷題數 (上限 25 題)</label>
                <input type="number" id="input-count" value="10" min="1" max="50" disabled>
            </div>

            <button class="main-btn" id="generate-btn" onclick="triggerRenderCompilation()" disabled>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                開始雲端組卷
            </button>
        </div>

    </div>

    <div style="text-align: center; font-size: 10px; color: #bbb; margin-top: 10px; letter-spacing: 1px; font-family: Arial, sans-serif;">
        &copy; 2026 蘇昊數理 Su-Hao Math/Science.
    </div>

    <script>
        // ==========================================
        // 核心設定與變數
        // ==========================================
        const MY_LIFF_ID = "2010896789-64Pzz9hx";
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwg1reUCaWdmvnjQyxxfOUSNL-6niiiaQlLztgOvSavphpUF2MzAXMVC1fa0TtLsLoC/exec?token=suhao2026";
        const RENDER_SERVER_URL = "https://question-database-jvfp.onrender.com/generate"; 

        let globalQuestions = [];
        let currentUser = { name: "同學", uid: "" };

        // ==========================================
        // 1. 初始化 LIFF
        // ==========================================
        window.onload = async function() {
            try {
                await liff.init({ liffId: MY_LIFF_ID });
                
                if (!liff.isInClient()) {
                    showError("為保護權益，題庫系統僅限在 LINE 聊天室內部開啟。");
                    return;
                }
                
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }

                const profile = await liff.getProfile();
                currentUser.name = profile.displayName;
                currentUser.uid = profile.userId;
                
                document.getElementById('user-name').innerText = currentUser.name;
                if(profile.pictureUrl) {
                    document.getElementById('user-avatar').src = profile.pictureUrl;
                }
                
                // 初次進來，將載入畫面藏起，等使用者選科目
                hideLoading();

            } catch (err) {
                showError("LINE 驗證失敗，請重新開啟此頁面。");
            }
        };

        // ==========================================
        // 2. 抓取雲端題庫資料 (隨科目動態變更)
        // ==========================================
        async function fetchQuestionBank() {
            const subject = document.getElementById('select-subject').value;
            if (!subject) return;

            setLoadingState("正在同步雲端題庫資料...", `向 Google 請求【${subject}】題庫中 (約需 2~3 秒)`);
            try {
                const response = await fetch(`${GAS_API_URL}&sheet=${subject}`);
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error);
                }
                
                if (!data || data.length === 0) {
                    throw new Error(`${subject}題庫目前沒有資料`);
                }
                
                globalQuestions = data;
                initDropdowns();

            } catch (error) {
                showError("題庫同步失敗：" + error.message);
                console.error(error);
            }
        }

        // ==========================================
        // 3. 無階層選單初始化
        // ==========================================
        function initDropdowns() {
            // 自動從整份試算表中抓取各種不重複的選項填入選單
            populateSelect('select-grade', '年段');
            populateSelect('select-exam', '段考');
            populateSelect('select-version', '版本');
            populateSelect('select-chapter', '章節');
            populateSelect('select-type', '題型');
            populateSelect('select-difficulty', '難易度');

            document.getElementById('input-count').disabled = false;
            document.getElementById('generate-btn').disabled = false;
            document.getElementById('db-info').innerHTML = `<b>資料庫同步完成</b><br>目前題庫總計收錄：<b>${globalQuestions.length}</b> 題。可以自由混搭條件！`;
            hideLoading();
        }

        function populateSelect(elementId, columnKey) {
            // 從 globalQuestions 中提取該欄位所有不重複且不為空的值
            const uniqueValues = [...new Set(globalQuestions.map(q => q[columnKey]).filter(Boolean))];
            const select = document.getElementById(elementId);
            
            select.innerHTML = '<option value="">全部</option>';
            uniqueValues.forEach(val => {
                let opt = document.createElement('option');
                opt.value = val; 
                opt.innerText = val;
                select.appendChild(opt);
            });
            select.disabled = false;
        }

        // ==========================================
        // 4. 傳送指令給 Render 伺服器
        // ==========================================
        async function triggerRenderCompilation() {
            const subject = document.getElementById('select-subject').value;
            let count = parseInt(document.getElementById('input-count').value);
            
            if (count < 1) count = 1;

            setLoadingState("正在驅動雲端編譯器...", "引擎排版中，請勿關閉視窗 (約需 10~15 秒)");

            // 將畫面上的選單整合成 filters 字典 (鍵名對齊您 23 欄位的標題)
            const currentFilters = {
                "年段": document.getElementById('select-grade').value,
                "段考": document.getElementById('select-exam').value,
                "版本": document.getElementById('select-version').value,
                "章節": document.getElementById('select-chapter').value,
                "題型": document.getElementById('select-type').value,
                "難易度": document.getElementById('select-difficulty').value
            };

            const payload = {
                uid: currentUser.uid,
                name: currentUser.name,
                subject: subject,
                questionCount: count,
                filters: currentFilters
            };

            try {
                const res = await fetch(RENDER_SERVER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    const responseData = await res.json();
                    
                    if (responseData.success && responseData.url) {
                        // 判斷如果是在 LINE 裡面，就自動發送訊息
                        if (liff.isInClient()) {
                            await liff.sendMessages([{
                                type: 'text',
                                text: `【雲端考卷產出成功】\n\n同學您好，這是您的 ${subject} 專屬測驗卷！\n\n📄 點擊下方連結立即查看：\n${responseData.url}\n\n(系統保護機制：此連結將於 24 小時後自動銷毀)`
                            }]);
                            alert("組卷成功！已自動將考卷連結傳送到聊天室。");
                            liff.closeWindow(); // 自動關閉網頁
                        } else {
                            // 如果用一般瀏覽器開的備用方案
                            alert("組卷成功！請點擊確定前往考卷。");
                            window.location.href = responseData.url;
                        }
                    } else {
                        showError("產出失敗：" + (responseData.error || "無法取得雲端連結"));
                    }
                } else {
                    const errData = await res.json();
                    showError("伺服器錯誤：" + (errData.error || "無回應"));
                }
            } catch (err) {
                showError("系統連線逾時，請確認 Render 服務是否正常。");
            }

        // ==========================================
        // UI 防護功能
        // ==========================================
        function setLoadingState(mainText, subText) {
            document.getElementById('loading-overlay').style.display = 'flex';
            document.getElementById('loading-text').innerText = mainText;
            document.getElementById('loading-subtext').innerText = subText;
        }

        function hideLoading() {
            document.getElementById('loading-overlay').style.display = 'none';
        }

        function showError(msg) {
            document.getElementById('loading-overlay').style.display = 'flex';
            document.getElementById('loading-overlay').innerHTML = `
                <div style="font-size: 40px; margin-bottom: 10px;"></div>
                <div style="color: #c0392b; font-weight: bold; font-size: 16px; text-align: center; padding: 0 20px;">
                    ${msg}
                </div>
            `;
        }

        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('copy', (e) => e.preventDefault());
    </script>
</body>
</html>
