<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>蘇昊數理｜雲端題庫系統</title>
    
    <meta name="description" content="學員的雲端自動組卷系統，即時篩選、雲端編譯、秒出考卷。">
    <link rel="icon" href="https://suuuuuhaooooo.github.io/-/favicon.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- 引入 LINE LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    
    <style>
        /* ==========================================
           基礎品牌與字體設定
           ========================================== */
        @font-face {
            font-family: 'SuHaoMing';
            src: url('cwTeXQMingZH-Medium.woff2') format('woff2'),
                 url('cwTeXQMingZH-Medium.ttf') format('truetype');
            font-display: swap; 
        }
        
        :root { 
            --primary: #8e9775; 
            --dark: #5b6348; 
            --bg: #f5f5f5; 
            --white: #ffffff; 
            --border: #eeeeee; 
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg);
            font-family: "Noto Serif TC", serif;
            color: #333;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            -webkit-user-select: none;
        }

        /* ==========================================
           頂部導覽列
           ========================================== */
        .navbar {
            background: white; padding: 15px 20px; box-shadow: 0 1px 5px rgba(0,0,0,0.05);
            display: flex; justify-content: space-between; align-items: center;
            position: fixed; top: 0; left: 0; width: 100%; box-sizing: border-box; z-index: 100;
            height: 60px;
        }
        .brand-title { font-weight: 700; font-size: 16px; color: var(--dark); letter-spacing: 1px; }
        .user-badge { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: bold; color: #666; }
        .user-badge img { width: 28px; height: 28px; border-radius: 50%; border: 1px solid #ddd; }

        /* ==========================================
           主容器與卡片設計
           ========================================== */
        .container {
            padding: 85px 20px 40px 20px;
            max-width: 500px;
            margin: 0 auto;
            box-sizing: border-box;
        }

        .filter-card {
            background: white;
            border-radius: 12px;
            padding: 25px 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.04);
            border-top: 5px solid var(--primary);
            margin-bottom: 20px;
        }

        .filter-card h2 {
            margin: 0 0 5px 0;
            font-size: 18px;
            color: var(--dark);
            letter-spacing: 1.5px;
        }
        .filter-card p {
            margin: 0 0 20px 0;
            font-size: 13px;
            color: #888;
            line-height: 1.5;
        }

        /* 表單元素 */
        .input-group { margin-bottom: 15px; }
        .input-group label {
            display: block; font-size: 13px; color: #444; margin-bottom: 6px; font-weight: bold; letter-spacing: 1px;
        }
        
        select, input[type="number"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            background: #fafafa;
            border-radius: 8px;
            font-family: "Noto Serif TC", serif;
            font-size: 14px;
            color: #333;
            outline: none;
            box-sizing: border-box;
            transition: 0.3s;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23888' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 15px center;
            background-size: 15px;
        }
        select:focus, input[type="number"]:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(142,151,117,0.1);
        }
        select:disabled, input[type="number"]:disabled { background-color: #eee; color: #999; cursor: not-allowed; }

        .main-btn { 
            background: var(--primary); color: white; border: none; padding: 15px; 
            width: 100%; cursor: pointer; letter-spacing: 2px; font-weight: 700; 
            transition: 0.3s; border-radius: 8px; font-size: 16px; font-family: "Noto Serif TC", serif;
            margin-top: 15px;
            display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .main-btn:disabled { background: #ccc; cursor: not-allowed; }
        .main-btn:hover:not(:disabled) { background: var(--dark); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(142,151,117,0.3); }

        /* ==========================================
           全螢幕 Loading 遮罩
           ========================================== */
        #loading-overlay { 
            display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(255,255,255,0.9); z-index: 9999; 
            backdrop-filter: blur(5px);
            flex-direction: column; justify-content: center; align-items: center; 
        }
        .spinner { 
            border: 4px solid #eef1e6; border-top: 4px solid var(--primary); 
            border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; margin-bottom: 15px; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-text { color: var(--dark); font-weight: bold; letter-spacing: 1.5px; font-size: 15px; }
        .loading-subtext { color: #888; font-size: 12px; margin-top: 8px; letter-spacing: 1px; }

        /* 資料統整小卡 */
        .info-box {
            background: #eef1e6;
            border-left: 4px solid var(--primary);
            padding: 12px 15px;
            border-radius: 0 8px 8px 0;
            font-size: 12px;
            color: #555;
            margin-bottom: 20px;
            line-height: 1.6;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="loading-overlay">
        <div class="spinner"></div>
        <div class="loading-text" id="loading-text">系統初始化中...</div>
        <div class="loading-subtext" id="loading-subtext">正在驗證您的 LINE 帳號</div>
    </div>

    <nav class="navbar">
        <div class="brand-title">蘇昊題庫中心</div>
        <div class="user-badge" id="user-badge">
            <span id="user-name">載入中</span>
            <img id="user-avatar" src="https://suuuuuhaooooo.github.io/-/favicon.png" alt="Avatar">
        </div>
    </nav>

    <div class="container">
        
        <div class="filter-card">
            <h2>自訂考卷條件</h2>
            <p>請自由組合篩選條件，無須依照順序，系統將自動過濾符合的題目。</p>
            
            <div class="info-box" id="db-info">
                請先選擇科目以載入題庫。
            </div>

            <!-- 科目選擇 (維持單選) -->
            <div class="input-group">
                <label>選擇科目</label>
                <select id="select-subject" onchange="fetchQuestionBank()">
                    <option value="" disabled selected>載入科目中...</option>
                </select>
            </div>

            <!-- 篩選條件 (加入 multiple 屬性，在手機上會自動變成複選打勾清單) -->
            <div class="input-group">
                <label>選擇年段 (可複選，不選代表全部)</label>
                <select id="select-grade" onchange="updateAvailableCount()" multiple disabled></select>
            </div>

            <div class="input-group">
                <label>選擇段考 (可複選)</label>
                <select id="select-exam" onchange="updateAvailableCount()" multiple disabled></select>
            </div>

            <div class="input-group">
                <label>選擇版本 (可複選)</label>
                <select id="select-version" onchange="updateAvailableCount()" multiple disabled></select>
            </div>

            <div class="input-group">
                <label>選擇章節 (可複選)</label>
                <select id="select-chapter" onchange="updateAvailableCount()" multiple disabled></select>
            </div>

            <div class="input-group">
                <label>選擇題型 (可複選)</label>
                <select id="select-type" onchange="updateAvailableCount()" multiple disabled></select>
            </div>

            <div class="input-group">
                <label>選擇難易度 (可複選)</label>
                <select id="select-difficulty" onchange="updateAvailableCount()" multiple disabled></select>
            </div>

            <!-- 抽卷題數 (改為 100 的因數選單) -->
            <div class="input-group">
                <label>抽卷題數 (滿分100分)</label>
                <select id="input-count" disabled>
                    <option value="10" selected>10 題 (每題 10 分)</option>
                    <option value="20">20 題 (每題 5 分)</option>
                    <option value="25">25 題 (每題 4 分)</option>
                    <option value="50">50 題 (每題 2 分)</option>
                    <option value="100">100 題 (每題 1 分)</option>
                </select>
            </div>

            <button class="main-btn" id="generate-btn" onclick="triggerRenderCompilation()" disabled>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                開始雲端組卷
            </button>
        </div>

    </div>

    <div style="text-align: center; font-size: 10px; color: #bbb; margin-top: 10px; letter-spacing: 1px; font-family: Arial, sans-serif;">
        &copy; 2026 蘇昊數理 Su-Hao Math/Science.
    </div>

    <script>
        // ==========================================
        // 核心設定與變數
        // ==========================================
        const MY_LIFF_ID = "2010896789-64Pzz9hx";
        const RENDER_API_BASE = "https://question-database-jvfp.onrender.com";

        let globalQuestions = [];
        let currentUser = { name: "同學", uid: "" };

        // ==========================================
        // 1. 初始化 LIFF (加速版)
        // ==========================================
        document.addEventListener('DOMContentLoaded', async function() {
            // 加入防呆機制：如果 8 秒後還在轉圈圈，強制解鎖畫面並跳出提示
            const timeout = setTimeout(() => {
                clearTimeout(timeout);
                hideLoading();
                alert("LINE 驗證連線較慢，請確認網路狀態或重新整理。");
            }, 8000);

            try {
                await liff.init({ liffId: MY_LIFF_ID });
                
                if (!liff.isInClient()) {
                    clearTimeout(timeout);
                    showError("為保護權益，題庫系統僅限在 LINE 聊天室內部開啟。");
                    return;
                }
                
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }

                const profile = await liff.getProfile();
                currentUser.name = profile.displayName;
                currentUser.uid = profile.userId;
                
                document.getElementById('user-name').innerText = currentUser.name;
                if(profile.pictureUrl) {
                    document.getElementById('user-avatar').src = profile.pictureUrl;
                }
                
                // 成功驗證，提早解除轉圈圈與計時器，等使用者選科目
                await loadSubjects();
                clearTimeout(timeout);
                hideLoading();

            } catch (err) {
                clearTimeout(timeout);
                showError("LINE 驗證失敗，請重新開啟此頁面。");
            }
        });
        async function loadSubjects() {
            try {
                const res = await fetch(`${RENDER_API_BASE}/api/subjects`);
                const subjects = await res.json();
                const select = document.getElementById('select-subject');
                select.innerHTML = '<option value="" disabled selected>請選擇科目...</option>';
                subjects.forEach(sub => {
                    let opt = document.createElement('option');
                    opt.value = sub;
                    opt.innerText = sub;
                    select.appendChild(opt);
                });
            } catch(e) {
                showError("無法載入科目清單，請確認網路連線。");
            }
        }

        // ==========================================
        // 2. 抓取雲端題庫資料 (隨科目動態變更)
        // ==========================================
        async function fetchQuestionBank() {
            const subject = document.getElementById('select-subject').value;
            if (!subject) return;

            setLoadingState("正在同步雲端題庫資料...", `向 Google 請求【${subject}】題庫中 (約需 2 ~ 3 分鐘)`);
            try {
                const response = await fetch(`${RENDER_API_BASE}/api/questions?subject=${subject}`);
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error);
                }
                
                if (!data || data.length === 0) {
                    throw new Error(`${subject}題庫目前沒有資料`);
                }
                
                globalQuestions = data;
                initDropdowns();

            } catch (error) {
                showError("題庫同步失敗：" + error.message);
                console.error(error);
            }
        }

        // ==========================================
        // 3. 無階層選單初始化與複選邏輯
        // ==========================================
        // ⚡️ 新增：取得複選選單所有被勾選的值
        function getSelectedValues(id) {
            const select = document.getElementById(id);
            if (!select) return [];
            return Array.from(select.selectedOptions).map(opt => opt.value);
        }

        function initDropdowns() {
            populateSelect('select-grade', '年段');
            populateSelect('select-exam', '段考');
            populateSelect('select-version', '版本');
            populateSelect('select-chapter', '章節');
            populateSelect('select-type', '題型');
            populateSelect('select-difficulty', '難易度');

            document.getElementById('input-count').disabled = false;
            
            // 呼叫新函式來顯示數字
            updateAvailableCount(); 
            
            hideLoading();
        }

        function updateAvailableCount() {
            if (!globalQuestions.length) return 0;

            // ⚡️ 改用 getSelectedValues 抓取陣列資料
            const filters = {
                "年段": getSelectedValues('select-grade'),
                "段考": getSelectedValues('select-exam'),
                "版本": getSelectedValues('select-version'),
                "章節": getSelectedValues('select-chapter'),
                "題型": getSelectedValues('select-type'),
                "難易度": getSelectedValues('select-difficulty')
            };
            
            let matchCount = 0;
            globalQuestions.forEach(q => {
                let match = true;
                for (let key in filters) {
                    // 如果這個條件有被勾選
                    if (filters[key].length > 0) {
                        let actualVal = String(q[key] || '').trim();
                        // 只要題目符合勾選的「其中一個」就算過關 (OR 邏輯)
                        let matchedAny = filters[key].some(expected => actualVal.includes(expected));
                        if (!matchedAny) {
                            match = false;
                            break;
                        }
                    }
                }
                if (match) matchCount++;
            });
            
            // 更新 UI 顯示
            document.getElementById('db-info').innerHTML = `
                <b>資料庫同步完成</b><br>
                目前題庫總計收錄：<b>${globalQuestions.length}</b> 題。<br>
                <span style="color: #c0392b; font-weight: bold; font-size: 14px; display: inline-block; margin-top: 8px;">
                    當前條件可用題數：${matchCount} 題
                </span>
            `;
            
            // 如果題數為 0，鎖定按鈕防止使用者送出報錯
            document.getElementById('generate-btn').disabled = (matchCount === 0);
            return matchCount; // 回傳題數給送出按鈕檢查用
        }

        function populateSelect(elementId, columnKey) {
            const uniqueValues = [...new Set(globalQuestions.map(q => q[columnKey]).filter(Boolean))];
            const select = document.getElementById(elementId);
            
            select.innerHTML = ''; // ⚡️ 複選不需要「全部」選項，清空即可
            uniqueValues.forEach(val => {
                let opt = document.createElement('option');
                opt.value = val; 
                opt.innerText = val;
                select.appendChild(opt);
            });
            select.disabled = false;
        }

        // ==========================================
        // 4. 傳送指令給 Render 伺服器
        // ==========================================
        async function triggerRenderCompilation() {
            const subject = document.getElementById('select-subject').value;
            let count = parseInt(document.getElementById('input-count').value);
            if (count < 1) count = 1;

            // ⚡️ 新增：題數不足的防呆檢查
            let currentMatchCount = updateAvailableCount();
            if (currentMatchCount < count) {
                alert(`題數不足！\n\n您設定要抽 ${count} 題，但目前的篩選條件只有 ${currentMatchCount} 題符合。\n請「放寬條件」或「減少抽卷題數」再試一次。`);
                return;
            }

            setLoadingState("正在驅動雲端編譯器...", "產生測驗卷與解答中，請勿關閉視窗 (約需幾 1 ~ 2 分鐘)");

            // ⚡️ 改用 getSelectedValues 抓取陣列資料打包送給後端
            const currentFilters = {
                "年段": getSelectedValues('select-grade'),
                "段考": getSelectedValues('select-exam'),
                "版本": getSelectedValues('select-version'),
                "章節": getSelectedValues('select-chapter'),
                "題型": getSelectedValues('select-type'),
                "難易度": getSelectedValues('select-difficulty')
            };

            const payload = {
                uid: currentUser.uid,
                name: currentUser.name,
                subject: subject,
                questionCount: count,
                filters: currentFilters
            };

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 90000);

                const res = await fetch(`${RENDER_API_BASE}/generate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                    signal: controller.signal
                });

                clearTimeout(timeoutId);

                if (res.ok) {
                    const responseData = await res.json();
                    
                    if (responseData.success) {
                        let filterText = "";
                        for (let key in responseData.filters) {
                            if (responseData.filters[key]) {
                                filterText += `◎ ${key}：${responseData.filters[key]}\n`;
                            }
                        }
                        if (filterText === "") filterText = "◎ 條件：無 (全範圍隨機抽題)\n";
                        let realName = responseData.student_name || "同學";
                        if (realName !== "同學" && !realName.includes("同學") && !realName.includes("老師")) {
                            realName += " 同學";
                        }
                        const lineMessage = `【雲端組卷產出成功通知】\n\n${realName}您好，這是為您篩選的 ${subject} 組卷！\n\n🔍 [篩選條件]\n${filterText}\n測驗卷連結：\n${responseData.exam_url}\n\n詳解卷連結：\n${responseData.ans_url}\n\n(系統保護機制：連結將於 24 小時後自動銷毀)`;

                        if (liff.isInClient()) {
                            await liff.sendMessages([{ type: 'text', text: lineMessage }]);
                            alert("組卷成功！已自動將考卷與解答傳送到聊天室。");
                            liff.closeWindow();
                        } else {
                            alert("組卷成功！");
                            console.log(lineMessage);
                        }
                    } else {
                        showError("產出失敗：" + (responseData.error || "未知錯誤"));
                    }
                } else {
                    const errData = await res.json();
                    showError("伺服器錯誤：" + (errData.error || "無回應"));
                }
            } catch (err) {
                console.error("錯誤：", err);
                if (err.name === 'AbortError') {
                    showError("連線逾時：伺服器處理時間超過 90 秒，請再試一次。");
                } else {
                    showError("發生錯誤：" + err.message);
                }
            }
        }
        // ==========================================
        // UI 防護功能
        // ==========================================
        function setLoadingState(mainText, subText) {
            document.getElementById('loading-overlay').style.display = 'flex';
            document.getElementById('loading-text').innerText = mainText;
            document.getElementById('loading-subtext').innerText = subText;
        }

        function hideLoading() {
            document.getElementById('loading-overlay').style.display = 'none';
        }

        function showError(msg) {
            hideLoading(); // 先隱藏轉圈圈遮罩，解鎖畫面
            alert(msg);    // 彈出可關閉的警告視窗
        }

        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('copy', (e) => e.preventDefault());
    </script>
</body>
</html>
