    <script>

    <style>
        /* ==========================================
           字體控制區塊
           ========================================== */

        @font-face {
            font-family: 'SuHaoMing';
            src: url('cwTeXQMingZH-Medium.woff2') format('woff2'),
                 url('cwTeXQMingZH-Medium.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap; 
        }
        .ai-content p, 
        .ai-content li {
            font-family: 'SuHaoMing', "Noto Serif TC", serif;
            letter-spacing: 0.5px;
        }
        .ai-content strong, 
        .ai-content b,
        .ai-content h3 {
            font-family: "Noto Serif TC", serif !important;
            font-weight: bold;
        }
        .ai-content mjx-container,
        .ai-content pre,
        .ai-content code {
            font-family: inherit !important;
        }
        :root { --primary: #8e9775; --dark: #5b6348; --user-bg: #eef1e6; --ai-bg: #ffffff; --bg: #f5f5f5; --border: #eeeeee; }

        html, body {
            margin: 0; padding: 0;
            background-color: var(--bg);
            font-family: "Noto Serif TC", serif;
            color: #333;
            -webkit-font-smoothing: antialiased;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        input[type="text"] { -webkit-user-select: auto; user-select: auto; font-family: "Noto Serif TC", serif; }
        .navbar {
            background: white; padding: 15px 20px; box-shadow: 0 1px 5px rgba(0,0,0,0.05);
            display: flex; justify-content: space-between; align-items: center;
            position: fixed; top: 0; left: 0; width: 100%; box-sizing: border-box; z-index: 100;
            height: 60px;
        }
        .brand-title { font-weight: 700; font-size: 16px; color: var(--dark); letter-spacing: 1px; }
        .status-badge { color: #888; font-size: 12px; font-weight: bold; letter-spacing: 1px; display: flex; align-items: center; gap: 6px; }
        .status-dot { width: 8px; height: 8px; background-color: #ccc; border-radius: 50%; }
        
        .chat-window {
            padding: 80px 15px 100px 15px; 
            display: flex; flex-direction: column; gap: 20px;
            width: 100%; box-sizing: border-box; min-height: 100vh;
        }

        .bubble {
            max-width: 92%; padding: 18px 22px; border-radius: 20px;
            font-size: 15px; line-height: 1.8; position: relative;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            word-wrap: break-word; overflow-wrap: break-word; word-break: break-word; 
        }
        .bubble.ai { align-self: flex-start; background: var(--ai-bg); border-bottom-left-radius: 4px; border: 1px solid #eaeaea; }
        .bubble.user { 
            align-self: flex-end; 
            background: var(--user-bg); 
            color: #4a5d23; 
            border-bottom-right-radius: 4px; 
            font-family: 'SuHaoMing', "Noto Serif TC", serif; 
            letter-spacing: 0.5px;
        }

        .question-thumb {
            max-width: 100%; max-height: 250px; border-radius: 8px;
            margin-bottom: 5px; cursor: pointer; border: 2px solid white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: block;
        }

        .input-bar {
            background: white; padding: 15px 20px; border-top: 1px solid #eee;
            display: flex; gap: 10px; position: fixed; bottom: 0; width: 100%;
            box-sizing: border-box; z-index: 10;
        }

        .input-bar input {
            flex: 1; border: 1px solid #ddd; border-radius: 25px;
            padding: 10px 20px; outline: none; font-size: 14px; background: #fafafa;
            font-family: 'SuHaoMing', "Noto Serif TC", serif;
        }

        .input-bar button {
            background: transparent; color: #333333; border: none;
            width: 40px; height: 40px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: 0.2s; padding: 0;
        }
        .input-bar button:disabled { color: #cccccc; cursor: not-allowed; }
        .input-bar button:hover:not(:disabled) { transform: scale(1.1); }

        .loading-container { align-self: flex-start; padding: 10px; }
        .loading-dots { display: flex; gap: 6px; margin-bottom: 8px; }
        .loading-dots div { width: 8px; height: 8px; background-color: var(--primary); border-radius: 50%; animation: bounce 0.6s infinite alternate; opacity: 0.8; }
        .loading-dots div:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots div:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { from { transform: translateY(0); opacity: 0.4; } to { transform: translateY(-8px); opacity: 1; } }
        .loading-text { color: #888; font-size: 12px; letter-spacing: 1px; animation: pulse-text 2s infinite ease-in-out; }
        @keyframes pulse-text { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

        .ai-content { color: #444; overflow-x: hidden; width: 100%; }
        .ai-content p { margin-bottom: 15px; text-align: left; line-height: 1.8; }
        .ai-content h3 { 
            color: var(--dark); font-size: 17px; margin-top: 25px; margin-bottom: 10px;
            padding-bottom: 6px; border-bottom: 2px solid var(--primary); display: block;
        }
        .ai-content h3:first-child { margin-top: 5px; }
        .ai-content ul, .ai-content ol { padding-left: 20px; margin-bottom: 15px; }
        .ai-content li { margin-bottom: 6px; }
        .ai-content mjx-container {
            max-width: 100% !important;
            overflow-x: auto !important;
            overflow-y: hidden !important;
            touch-action: pan-x !important;
            padding-bottom: 4px; 
        }
        .ai-content mjx-container[display="true"] {
            display: block !important; 
        }
        .ai-content pre { 
            max-width: 100%; 
            overflow-x: auto; 
            overflow-y: hidden; 
            touch-action: pan-x !important;
            padding-bottom: 5px; 
        }
        .error-msg { text-align: center; color: #b03a2e; padding: 15px; font-size: 14px; background: #fdfaf6; border-radius: 8px; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="brand-title">蘇昊解題中心</div>
        <div class="status-badge" id="system-status-box">
            <div class="status-dot" id="system-status-dot"></div>
            <span id="system-status-text">連線中...</span>
        </div>
    </nav>

    <div id="chat-window" class="chat-window">
        <div id="loading-area" class="loading-container">
            <div class="loading-dots"><div></div><div></div><div></div></div>
            <div class="loading-text" id="loading-text">正在讀取題目影像...</div>
        </div>
    </div>

    <div class="input-bar" id="input-bar" style="display: none;">
        <input type="text" id="chat-input" placeholder="對解析有疑問嗎？" autocomplete="off">
        <button id="chat-send-btn" onclick="sendFollowUp()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
    </div>

    <script>
        // 核心函式定義 (放在最前面，解決 is not defined)
        function updateStatus(text, dotColor) {
            const statusText = document.getElementById('system-status-text');
            const statusDot = document.getElementById('system-status-dot');
            if (statusText && statusDot) {
                statusText.innerText = text;
                statusDot.style.backgroundColor = dotColor;
            }
        }

        const chatWindow = document.getElementById('chat-window');
        const MY_LIFF_ID = "2010007538-HEESDWze"; 
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwxFfufe0b7eJpDxSmLgnbVvlq1itLvoD6ZCpvDJKtJg7ChcWn7lpf9LgZqQ4ZsThJiXQ/exec";
        
        window.sessionImage = null;       
        window.initialResponse = "";      
        window.followUps = [];            
        window.activeTaskId = null; // 全域儲存目前的 taskId

        // Firebase 系統設定
        const firebaseConfig = {
            apiKey: "AIzaSyALkTnkYY3JZLCTyajahpi4IZKmFX9USdw",
            authDomain: "su-hao-classroom.firebaseapp.com",
            projectId: "su-hao-classroom",
            storageBucket: "su-hao-classroom.firebasestorage.app",
            messagingSenderId: "764168135846",
            appId: "1:764168135846:web:f2923a5f4952fa1ca64067",
            databaseURL: "https://su-hao-classroom-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        // ==========================================
        // 2. 主流程
        // ==========================================
        initializeLiff();

        async function initializeLiff() {
            try {
                await liff.init({ liffId: MY_LIFF_ID });
                if (!liff.isInClient()) {
                    showError("為保護權益，本系統僅限在 LINE 聊天室內部開啟。");
                    document.getElementById('input-bar').style.display = "none";
                    return; 
                }
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }
                let tid = new URLSearchParams(window.location.search).get('taskId'); 
                if (!tid) {
                    const searchData = liff.getSearchData();
                    if (searchData) tid = new URLSearchParams(searchData).get('taskId');
                }
                if (!tid) {
                    const hashData = window.location.hash.split('?')[1];
                    if (hashData) tid = new URLSearchParams(hashData).get('taskId');
                }

                if (!tid) {
                    showError("無效的解題連結！請由 LINE 官方帳號重新發起請求。");
                    return;
                }

                window.activeTaskId = tid;
                const profile = await liff.getProfile();
                window.visitorUid = profile.userId;
                fetchTaskDataSecurely(tid, profile.userId);

            } catch (err) {
                showError("LINE 驗證初始化失敗：" + err.message);
            }
        }

        function fetchTaskDataSecurely(tid, visitorUid) {
            db.ref("ai_tasks/" + tid).once("value").then((snap) => {
                const data = snap.val();
                if (!data) {
                    showError("找不到此題目的資料，提問可能已過期。");
                    return;
                }
                const isOwner = (visitorUid && data.uid === visitorUid);
                if (data.image) window.sessionImage = data.image;
                if (data.status === "completed" && data.ai_response) {
                    window.initialResponse = data.ai_response;
                    window.followUps = data.follow_ups || [];
                    renderInitialResult(data.ai_response, isOwner);
                    renderChatHistory(); 
                } else {
                    if (isOwner) {
                        updateStatus("解題中", "#f1c40f");
                        document.getElementById('loading-text').innerText = "AI 解題幫手正在進行邏輯拆解與運算...";
                        callGeminiFirstTurn(data.image, tid, data.uid);
                    } else {
                        showError("原發問者的解析尚未完成，請稍後再試。");
                    }
                }
            }).catch(err => showError("資料庫連線失敗：" + err.message));
        }

        async function callGeminiFirstTurn(base64Img, tid, uid) {
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST', headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ 
                        action: "smartSolveImage", 
                        image: base64ImageClean(base64Img),
                    })
                });
                
                const resultText = await response.text();
                let result = JSON.parse(resultText);
                
                if (result.success && result.text) {
                    window.initialResponse = result.text;
                    renderInitialResult(result.text);
                    db.ref("ai_tasks/" + tid).update({ status: "completed", ai_response: result.text, image: null });
                } else { 
                    throw new Error(result.error || "AI 解題幫手忙線中，請稍後重試。"); 
                }
            } catch (error) { showError("錯誤：" + error.message); }
        }
        async function sendFollowUp() {
            const inputEl = document.getElementById('chat-input');
            const userText = inputEl.value.trim();
            if (!userText || !window.activeTaskId) return;
            
            inputEl.value = ""; inputEl.disabled = true;
            appendChatBubble('user', userText);
            const loadingId = appendChatBubble('ai', "<div class='loading-dots' style='margin:0;'><div></div><div></div><div></div></div>");
            scrollToBottom();

            let apiContents = [];
            if (window.sessionImage) apiContents.push({ role: "user", parts: [{ text: "題目圖" }, { inline_data: { mime_type: "image/jpeg", data: base64ImageClean(window.sessionImage) } }] });
            apiContents.push({ role: "model", parts: [{ text: window.initialResponse }] });
            window.followUps.forEach(msg => apiContents.push({ role: msg.role === 'user' ? "user" : "model", parts: [{ text: msg.text }] }));
            apiContents.push({ role: "user", parts: [{ text: userText }] });

            try {
                const response = await fetch(SCRIPT_URL, { 
                    method: 'POST', headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ action: "askGemini", geminiPayload: { system_instruction: { parts: [{ text: SYSTEM_PROMPT }] }, contents: apiContents } }) 
                });
                const result = await response.json();
                const aiReply = result?.candidates?.[0]?.content?.parts?.[0]?.text;
                document.getElementById(loadingId).remove();
                if (aiReply) {
                    appendChatBubble('ai', formatAIResponse(aiReply));
                    window.followUps.push({ role: "user", text: userText }, { role: "model", text: aiReply });
                    db.ref("ai_tasks/" + window.activeTaskId).update({ follow_ups: window.followUps });
                    triggerMathJax();
                }
            } catch (e) { document.getElementById(loadingId).innerText = "錯誤: " + e.message; }
            inputEl.disabled = false; inputEl.focus(); scrollToBottom();
        }

        // 3. 輔助功能
        function appendChatBubble(role, html, id = null) {
            const b = document.createElement('div');
            b.className = `bubble ${role} ${role === 'ai' ? 'ai-content' : ''}`;
            b.innerHTML = html;
            const cid = id || "id_" + Date.now();
            b.id = cid; chatWindow.appendChild(b); return cid;
        }

        function renderInitialResult(text, isOwner = true) {
            document.getElementById('loading-area').style.display = "none";
            
            if (window.sessionImage) {
                let userHint = isOwner ? "這是我想問的題目。" : "這是原發問者的題目。";
                appendChatBubble('user', `<img src="data:image/jpeg;base64,${window.sessionImage}" class="question-thumb" onclick="window.open(this.src)"><div style="font-size:13px; opacity:0.8;">${userHint}</div>`);
            }
            appendChatBubble('ai', formatAIResponse(text));
            if (isOwner) {
                document.getElementById('input-bar').style.display = "flex";
                updateStatus("解析完成", "#8e9775");
            } else {
                document.getElementById('input-bar').style.display = "none";
                updateStatus("唯讀分享模式", "#3498db");
            }
            
            triggerMathJax();
            setTimeout(scrollToBottom, 300);
        }

        function renderChatHistory() {
            window.followUps.forEach(m => appendChatBubble(m.role==='user'?'user':'ai', m.role==='user'?m.text:formatAIResponse(m.text)));
            triggerMathJax(); setTimeout(scrollToBottom, 300);
        }

        function showError(m) {
            document.getElementById('loading-area').style.display = "none";
            appendChatBubble('ai', `<div class="error-msg">${m}</div>`);
            updateStatus("發生異常", "#c0392b");
        }

        // 🟢 加強版的 AI 回覆格式化函式 (徹底解決 Markdown 與 LaTeX 衝突)
        function formatAIResponse(text) {
            let processed = text.replace(/\\begin\{tikzpicture\}([\s\S]*?)\\end\{tikzpicture\}/g, m => `<script type="text/tikz">\n${m}\n<\/script>`);
            const mathBlocks = [];
            processed = processed.replace(/(\$\$[\s\S]*?\$\$|\$[\s\S]*?\$)/g, (match) => {
                mathBlocks.push(match);
                return `%%%MATH_BLOCK_${mathBlocks.length - 1}%%%`;
            });
            marked.setOptions({ breaks: true, gfm: true });
            let html = marked.parse(processed);
            html = html.replace(/%%%MATH_BLOCK_(\d+)%%%/g, (match, index) => {
                return mathBlocks[index];
            });
            return html;
        }

        function triggerMathJax() { if (window.MathJax) MathJax.typesetPromise().catch(e => console.log(e.message)); }
        function base64ImageClean(s) { return s.includes(",") ? s.split(",")[1] : s; }
        function scrollToBottom() { window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }); }
        
        document.getElementById('chat-input').addEventListener('keypress', e => { if (e.key === 'Enter') sendFollowUp(); });
        document.addEventListener('contextmenu', e => { e.preventDefault(); alert("版權所有，翻印必究！"); });
    </script>

        &copy; 2026 蘇昊數理 Su-Hao Math/Science. All Rights Reserved.
    </div>
